  <script>
    (function() {
      try {
        // Auto-purge legacy TUHH cache on first load
        if (!localStorage.getItem('roost_cache_flushed_v2')) {
          [
            'tuhh_showcase_data_v215', 'uhhs_showcase_data_v1', 'uhhs_showcase_data_v2',
            'uh_airbnb_audited_cache', 'uhhs_properties_cache', 'hybrid_sync_cache',
            'uh_airbnb_review_followups', 'all_properties_cache', 'rooms_cache'
          ].forEach(k => localStorage.removeItem(k));
          localStorage.setItem('roost_cache_flushed_v2', 'true');
        }
        localStorage.removeItem('uhhs_theme');
        localStorage.removeItem('uh_theme');
        localStorage.setItem('uhhs_theme', 'light');
        localStorage.setItem('uh_theme', 'light');
        document.documentElement.classList.remove('horilla-dark');
        document.documentElement.setAttribute('data-theme', 'light');
        if (document.body) {
          document.body.classList.remove('horilla-dark');
          document.body.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>

  <!-- PWA Service Worker Registration (Silent Background Updates · No Intrusive Modals) -->
  <script>
    // Remove any leftover modal overlay immediately if present in DOM
    document.getElementById('mandatoryUpdateModalOverlay')?.remove();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }).catch(err => {
          console.warn('SW registration notice:', err.message);
        });
      });
    }

    // Clean up stale dry-run localStorage keys
    ['uhhs_wa_automation_v1', 'uhhs_wa_automation_v2', 'uhhs_wa_automation_v3', 'uhhs_wa_automation_v4', 'uhhs_accepted_build_version'].forEach(k => {
      try { localStorage.removeItem(k); } catch(e) {}
    });
  </script>

  <!-- PWA Install Banner (Dismissible & Non-blocking) -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom, 0px));right:14px;z-index:99995;background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);color:white;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.4);align-items:center;gap:10px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.3px;border:1.5px solid rgba(255,255,255,0.25);white-space:nowrap;max-width:90vw;">
    <span id="pwa-install-trigger" onclick="window.promptPWAInstall()" style="cursor:pointer;display:flex;align-items:center;gap:7px;">
      <span style="font-size:16px;">📲</span> <span>Install App</span>
    </span>
    <button type="button" id="pwa-dismiss-btn" aria-label="Dismiss" style="background:rgba(255,255,255,0.2);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;">✕</button>
  </div>

  <script>
    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
      const bar = document.getElementById("pwa-install-bar");
      if (bar) {
        bar.style.display = "inline-flex";
        bar.style.opacity = "1";
      }
    });

    window.promptPWAInstall = async function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        const bar = document.getElementById("pwa-install-bar");
        if (bar) bar.style.display = "none";
        return;
      }
      // If iOS or deferredPrompt not available, show helpful modal
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      document.getElementById('pwaGuideModalOverlay')?.remove();
      const modal = document.createElement('div');
      modal.id = 'pwaGuideModalOverlay';
      modal.className = 'modal-overlay';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.75);backdrop-filter:blur(6px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;';
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
      modal.innerHTML = `
        <div style="background:#ffffff;border-radius:20px;max-width:400px;width:100%;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.3);font-family:'Plus Jakarta Sans',sans-serif;border:1px solid #e2e8f0;">
          <div style="background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:24px;">📲</span>
              <div>
                <div style="font-size:15px;font-weight:800;">Install Roost CRM</div>
                <div style="font-size:11px;color:#94a3b8;">Add to Mobile Home Screen</div>
              </div>
            </div>
            <button onclick="document.getElementById('pwaGuideModalOverlay').remove()" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;">✕</button>
          </div>
          <div style="padding:20px;color:#1e293b;font-size:13px;line-height:1.6;">
            ${isIOS ? `
              <div style="font-weight:700;margin-bottom:8px;color:#0f172a;">📱 Install on iPhone / iPad (Safari):</div>
              <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;">
                <li>Tap the <strong>Share</strong> icon (⎋) at the bottom of Safari.</li>
                <li>Scroll down and tap <strong>Add to Home Screen</strong> (⊞).</li>
                <li>Tap <strong>Add</strong> in the top right corner.</li>
              </ol>
            ` : `
              <div style="font-weight:700;margin-bottom:8px;color:#0f172a;">📱 Install on Android (Chrome / Browser):</div>
              <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;">
                <li>Tap the <strong>3-dots menu</strong> (⋮) in your browser top right.</li>
                <li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li>
                <li>Confirm by tapping <strong>Install</strong>.</li>
              </ol>
            `}
            <div style="margin-top:16px;background:#f8fafc;padding:10px 12px;border-radius:10px;font-size:11.5px;color:#64748b;border:1px solid #e2e8f0;">
              ✨ Once installed, the CRM works like a native app with fullscreen display and offline support.
            </div>
          </div>
          <div style="padding:12px 20px 18px;">
            <button onclick="document.getElementById('pwaGuideModalOverlay').remove()" style="width:100%;padding:11px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">Got It</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    };

    document.getElementById("pwa-dismiss-btn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const bar = document.getElementById("pwa-install-bar");
      if (bar) bar.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      const bar = document.getElementById("pwa-install-bar");
      if (bar) bar.style.display = "none";
    });
  </script>
