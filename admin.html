    (function() {
      try {

          [
            'tuhh_showcase_data_v215', 'uhhs_showcase_data_v1', 'uhhs_showcase_data_v2',
            'uh_airbnb_audited_cache', 'uhhs_properties_cache', 'hybrid_sync_cache',
            'uh_airbnb_review_followups', 'all_properties_cache', 'rooms_cache'
          ].forEach(k => localStorage.removeItem(k));
          localStorage.setItem('roost_cache_flushed_v2', 'true');
        }
        localStorage.removeItem('uhhs_theme');
        localStorage.removeItem('uh_theme');
        localStorage.setItem('uhhs_theme', 'light');
        localStorage.setItem('uh_theme', 'light');
        document.documentElement.classList.remove('horilla-dark');
        document.documentElement.setAttribute('data-theme', 'light');
        if (document.body) {
          document.body.classList.remove('horilla-dark');
          document.body.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();

  <!-- PWA Service Worker Registration (Silent Background Updates · No Intrusive Modals) -->
  <script>
    // Remove any leftover modal overlay immediately if present in DOM
    document.getElementById('mandatoryUpdateModalOverlay')?.remove();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        }).catch(err => {
          console.warn('SW registration notice:', err.message);
        });
      });
    }

    // Clean up stale dry-run localStorage keys
    ['uhhs_wa_automation_v1', 'uhhs_wa_automation_v2', 'uhhs_wa_automation_v3', 'uhhs_wa_automation_v4', 'uhhs_accepted_build_version'].forEach(k => {
      try { localStorage.removeItem(k); } catch(e) {}
    });
  </script>

  <!-- PWA Install Banner (Dismissible & Non-blocking) -->
  <div id="pwa-install-bar" style="display:none;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom, 0px));right:14px;z-index:99995;background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%);color:white;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,0.3);align-items:center;gap:8px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.3px;border:1px solid rgba(255,255,255,0.18);white-space:nowrap;max-width:85vw;">
    <span id="pwa-install-trigger" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
      <span>📲</span> <span>Install App</span>
    </span>
    <button type="button" id="pwa-dismiss-btn" aria-label="Dismiss" style="background:rgba(255,255,255,0.18);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;transition:background 0.2s;">✕</button>
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Do not display if user has already dismissed or is running in standalone PWA mode
      if (localStorage.getItem('uhhs_pwa_dismissed') === '1') return;
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
      const bar = document.getElementById("pwa-install-bar");
      if (bar) {
        bar.style.display = "inline-flex";
        bar.style.opacity = "1";
        // Auto-dismiss after 10 seconds so it never permanently blocks view
        setTimeout(() => {
          if (bar && bar.style.display !== 'none') {
            bar.style.opacity = '0';
            bar.style.transition = 'opacity 0.4s ease';
            setTimeout(() => { bar.style.display = 'none'; }, 400);
          }
        }, 10000);
      }
    });

    document.getElementById("pwa-install-trigger")?.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("pwa-install-bar").style.display = "none";
    });

    document.getElementById("pwa-dismiss-btn")?.addEventListener("click", (e) => {
      e.stopPropagation();
      localStorage.setItem('uhhs_pwa_dismissed', '1');
      const bar = document.getElementById("pwa-install-bar");
      if (bar) bar.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      localStorage.setItem('uhhs_pwa_dismissed', '1');
      document.getElementById("pwa-install-bar").style.display = "none";
    });
  </script>
