<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 130" width="260" height="130">
  <defs>
    <!-- Circular text paths -->
    <path id="topArcRR" d="M 32,72 A 44,44 0 1,1 120,72" fill="none" />
    <path id="botArcRR" d="M 120,72 A 44,44 0 0,1 32,72" fill="none" />
  </defs>

  <!-- Group 1: Company Seal (Executive Burgundy/Indigo Tone) -->
  <g transform="rotate(-5 76 68)">
    <!-- Outer Double Ring -->
    <circle cx="76" cy="68" r="48" fill="none" stroke="#7C2D12" stroke-width="2.5" opacity="0.9"/>
    <circle cx="76" cy="68" r="43" fill="none" stroke="#9A3412" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>
    <circle cx="76" cy="68" r="28" fill="none" stroke="#7C2D12" stroke-width="1.2" opacity="0.85"/>

    <!-- Seal Inner Text -->
    <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="6.8" font-weight="800" fill="#7C2D12" letter-spacing="1.2" opacity="0.95">
      <textPath href="#topArcRR" startOffset="50%" text-anchor="middle">
        ROOST AND REST STAYS
      </textPath>
    </text>
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5.5" font-weight="700" fill="#9A3412" letter-spacing="0.8" opacity="0.9">
      <textPath href="#botArcRR" startOffset="50%" text-anchor="middle">
        ★ LUCKNOW (U.P.) ★
      </textPath>
    </text>

    <!-- Center Seal Core -->
    <text x="76" y="65" font-family="'Cinzel', Georgia, serif" font-size="6.5" font-weight="900" fill="#7C2D12" text-anchor="middle" letter-spacing="0.8">
      AUTHORIZED
    </text>
    <text x="76" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#9A3412" text-anchor="middle" letter-spacing="0.4">
      DIRECTOR
    </text>
  </g>

  <!-- Group 2: Artistic Cursive Signature in Deep Royal Ink (Anwar Ahmad) -->
  <g stroke="#1E3A8A" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- A & Initial Flourish -->
    <path d="M 92,78 C 98,52 105,32 112,18 C 113,16 108,36 105,58 C 102,78 100,94 98,102" stroke-width="2.6"/>
    <path d="M 102,28 C 110,20 128,21 132,32 C 134,42 118,48 106,50" stroke-width="2.2"/>
    
    <!-- n-w-a-r cursive flow -->
    <path d="M 120,53 Q 126,45 130,50 Q 134,56 140,46 Q 144,40 148,53 Q 152,58 158,48 Q 162,42 166,50 Q 170,46 176,48 Q 180,44 186,52" stroke-width="2.0"/>

    <!-- A-h-m-a-d flourish -->
    <path d="M 172,60 C 176,38 188,24 196,26 C 202,28 196,46 182,56 C 174,62 182,70 196,66 C 206,63 218,56 228,50" stroke-width="2.4"/>

    <!-- Underline sweep flourish -->
    <path d="M 98,85 C 132,90 178,85 228,64 C 233,62 222,70 196,78 C 170,86 128,90 102,87" stroke-width="1.8" stroke="#2563EB"/>
    <!-- Small dots -->
    <circle cx="232" cy="64" r="1.5" fill="#1E3A8A"/>
    <circle cx="238" cy="62" r="1.2" fill="#1E3A8A"/>
  </g>

  <!-- Small Digital Certificate Stamp Badge -->
  <g transform="translate(152, 102)">
    <rect x="0" y="0" width="102" height="17" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
    <text x="7" y="12" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#15803D">
      ✔ Digitally Verified by Roost &amp; Rest
    </text>
  </g>
</svg>
